[package]
description = "Experimental AFFiNE desktop client using Tauri and WebKit"
edition     = "2024"
license     = "MIT"
name        = "affine-tauri"
version     = "0.1.0"

# Keep the shell independent of AFFiNE's Node native-module toolchain.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
mime_guess = "2"
open = "5"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"

[profile.release]
codegen-units = 1
lto           = "thin"
strip         = true

[features]
custom-protocol = ["tauri/custom-protocol"]
default         = ["custom-protocol"]
