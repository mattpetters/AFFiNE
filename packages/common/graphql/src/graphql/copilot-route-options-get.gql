query getCopilotRouteOptions($workspaceId: String, $promptName: String!) {
  currentUser {
    copilot(workspaceId: $workspaceId) {
      routeOptions(promptName: $promptName) {
        routeId
        defaultTargetId
        choices {
          id
          displayName
          minimumTier
          available
        }
      }
    }
  }
}
